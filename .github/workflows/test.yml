name: Test and Coverage

on:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    # Crucial: Allow the action to write the badge file back to your repo
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # 1. Run your language-specific test coverage tool here
      # (Ensure it generates a standard summary report, like coverage/coverage-summary.json for Jest)
      - name: Run Tests
        run: npm ci && npm run test:coverage 

      # 2. Generate the coverage badge
      - name: Coverage Badge
        uses: wouterds/github-coverage-badge-action@v1.0.1
