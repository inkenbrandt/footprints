[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "fluxfootprints"
version = "0.5.0"
description = "A comprehensive Python package for micrometeorological footprint analysis"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "GNU General Public License v3.0"}
authors = [
    {name = "Paul Inkenbrandt", email = "paulinkenbrandt@utah.gov"},
    {name = "Diane Menuz", email = "dmenuz@utah.gov"},
    {name = "Natascha Kljun", email = "natascha.kljun@cec.lu.se"},
    {name = "John Volk", email = "John.Volk@dri.edu "},
]
dependencies = [
    "numpy>=2.0.0", 
    "pandas>=2.0.0", 
    "xarray>=2025.1.0", 
    "scipy>=1.11", 
    "matplotlib>=3.10", 
    "shapely>=2.0", 
    "fiona>=1.8.0", 
    "geopandas>=1.0", 
    "rasterio>=1.3", 
    "pyproj>=3.5", 
    "affine>=2.4", 
    "requests>=2.28", 
    "netcdf4>=1.6",
]


[project.optional-dependencies]
docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme>=1.2",
    "myst-parser>=2.0",
    "sphinxcontrib-bibtex>=2.5",
    "sphinx-copybutton>=0.5",
    "sphinx-autodoc-typehints>=1.20",
    "sphinx-gallery>=0.14",
    "nbsphinx>=0.9",
    "numpydoc>=1.1",
]
contours = [
    "scikit-image>=1.0",
    "scikit-learn>=1.3",
]

gee = [
    "earthengine-api>=1.0",  # Google Earth Engine client, for representativeness_data
    "rioxarray>=0.15",       # .rio accessor the fetched rasters carry their CRS on
]

animation = [
    "contextily>=1.6",      # georeferenced basemap tiles
    "imageio-ffmpeg>=0.5",  # bundled ffmpeg binary for MP4/WebM output
]

examples = [
    "jupyter>=1.1.1",
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.1",
    "seaborn>=0.13.2",
    "plotly>=6.9.0"
]
test = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1",
    "tox>=4.58",
    "black>=26.5.1",
    "ruff>=0.16.2",         # fast linter/formatter
]


[project.urls]
"Homepage" = "https://github.com/inkenbrandt/footprints"
"Documentation" = "https://fluxfootprints.readthedocs.io/en/stable/"


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: end-to-end tests that build a footprint climatology from the bundled tower data (deselect with '-m \"not slow\"')",
]
